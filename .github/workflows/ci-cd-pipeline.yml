name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set environment variables for tests
        run: |
          echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          echo "API_KEY=test-api-key" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key" >> $GITHUB_ENV
          echo "ENVIRONMENT=test" >> $GITHUB_ENV

      - name: Run unit tests
        run: |
          python -m pytest tests/test_app.py::TestUnitTests -v --tb=short

      - name: Run integration tests
        run: |
          python -m pytest tests/test_app.py::TestIntegrationTests -v --tb=short

      - name: Run regression tests
        run: |
          python -m pytest tests/test_app.py::TestRegressionTests -v --tb=short

      - name: Run CI/CD specific tests
        run: |
          python -m pytest tests/test_app.py::TestCICDSpecific -v --tb=short

      - name: Run all tests with coverage
        run: |
          python -m pytest tests/test_app.py -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort

      - name: Run flake8
        run: |
          flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Check code formatting with black
        run: |
          black --check tests/
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          isort --check-only tests/
        continue-on-error: true

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create build artifacts
        run: |
          mkdir -p build
          cp -r tests/ build/
          if [ -f requirements.txt ]; then cp requirements.txt build/; fi
          echo "Build completed at $(date)" > build/build-info.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Tests Status: ${{ needs.test.result }}"
          echo "Lint Status: ${{ needs.lint.result }}"
          echo "Build Status: ${{ needs.build.result }}"

          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.lint.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ All CI/CD checks passed!"
            exit 0
          else
            echo "❌ Some CI/CD checks failed"
            exit 1
          fi
